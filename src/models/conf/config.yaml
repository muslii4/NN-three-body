defaults:
  - model: resnet
  - _self_

mode: train
seed: 42

dataset:
  path: dataset_1k_v1.h5
  batch_size: 8

training:
  epochs: 100
  learning_rate: 0.0001
  validation_epochs: 10
  output_dir: checkpoints/${model.type}

loss:
  type: mse

optimizer:
  type: adam

hydra:
  run:
    dir: outputs/${model.type}/${now:%Y-%m-%d_%H-%M-%S}