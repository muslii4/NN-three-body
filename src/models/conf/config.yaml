defaults:
  - model: resnet
  - _self_

mode: train_eval
seed: 42

dataset:
  path: dataset_1k_v1.h5
  batch_size: 8
  number_trajectories: 10
  points_trajectory: 150

training:
  epochs: 10
  learning_rate: 0.0001

  early_stopping:
    patience: 10
    min_delta: 0.000001
    max_overfit: 0.65

  lr_scheduler:
    factor: 0.7
    patience: 5
    min_lr: 0.000000001

  output_dir: checkpoints/${model.type}

loss:
  type: mse

optimizer:
  type: adam

hydra:
  run:
    dir: outputs/${model.type}/${now:%Y-%m-%d_%H-%M-%S}