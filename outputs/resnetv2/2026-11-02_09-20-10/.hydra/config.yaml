model:
  type: resnetv2
  dt: 0.0001
  steps: 1
  hidden_size: 256
  num_layers: 5
  G: 1.0
  masses:
  - 1.0
  - 1.0
  - 1.0
  epsilon: 1.0e-08
  lambda_kinematics: 0
  lambda_dynamics: 0
  lambda_energy: 0
mode: train
seed: 42
dataset:
  path: dataset_1k_v1.h5
  batch_size: 32
  number_trajectories: 1000
  points_trajectory: 5001
  flatten_transitions: true
training:
  epochs: 500
  learning_rate: 0.0001
  grad_clip: 1.0
  early_stopping:
    patience: 30
    warmup_epochs: 15
    min_delta: 1.0e-06
    max_overfit: 2.5
  lr_scheduler:
    factor: 0.7
    patience: 5
    min_lr: 1.0e-09
  output_dir: checkpoints/${model.type}
loss:
  type: mse
optimizer:
  type: adam
